steps:
  byggsteg-trigger-jointhefreeworld:
    image: "alpine:3.22.0"
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]        
    environment:
      BYGGSTEG_URL: "https://byggsteg.jointhefreeworld.org" 
      BYGGSTEG_KEY:
        from_secret: "BYGGSTEG_KEY"
      BYGGSTEG_USERNAME: "Joe"
      JOB_CODE: |
        (lambda()
        `((project . "kracht")
          (branch-name . "trunk")
          (task . "make-test")
          (clone-url . "https://codeberg.org/jjba23/kracht")))
    commands: |
      echo -e "Installing base packages"
      apk add curl jq
      
      echo -e "POST call to $BYGGSTEG_URL/api/v1/jobs/manage/submit"
      curl -s "$BYGGSTEG_URL/api/v1/jobs/manage/submit" \
        -X POST \
        -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode "username=$BYGGSTEG_USERNAME" \
        --data-urlencode "password=$BYGGSTEG_KEY" \
        --data-urlencode "job-code=$JOB_CODE" \
            > byggsteg-submit-job-response.json
      cat byggsteg-submit-job-response.json | jq .
      
      BYGGSTEG_LOG_ID=$(cat byggsteg-submit-job-response.json | jq -r '.["log-id"]')
      
      echo -e "Job created at Byggsteg successfully, log-id: $BYGGSTEG_LOG_ID"

      POLL_INTERVAL_SECONDS=6
      POLL_LIMIT=1024
      POLL_COUNT=0
      
      function poll-for-job-success {
          if [ "$POLL_COUNT" == "$POLL_LIMIT" ]; then
              echo -e "Reached limit poll attempts ($POLL_LIMIT), pipeline failed"
              exit 1
          fi
          
          echo -e "GET call to $BYGGSTEG_URL/api/v1/logs/$BYGGSTEG_LOG_ID"      
          curl -s "$BYGGSTEG_URL/api/v1/logs/$BYGGSTEG_LOG_ID" \
              > byggsteg-log-response.json
          cat byggsteg-log-response.json | jq .
          
          POLL_COUNT=$(( POLL_COUNT + 1 ))

          BYGGSTEG_JOB_SUCCEEDED=$(cat byggsteg-log-response.json | jq -r '.["success"]')
          BYGGSTEG_JOB_FAILURE=$(cat byggsteg-log-response.json | jq -r '.["failure"]')
          BYGGSTEG_JOB_IN_PROGRESS=$(cat byggsteg-log-response.json | jq -r '.["in-progress"]')

          if [ "$BYGGSTEG_JOB_SUCCEEDED" == 1 ]; then
              echo "Byggsteg job completed successfully!"
              exit 0
          fi

          if [ "$BYGGSTEG_JOB_FAILED == 1 ]; then
              echo "Byggsteg job faild!"
              exit 1
          fi      

          if [ "$BYGGSTEG_JOB_IN_PROGRESS == 1 ]; then
              echo "Byggsteg job in progress... will poll again for status in $POLL_INTERVAL_SECONDS seconds"
              sleep "$POLL_INTERVAL_SECONDS"
              poll-for-job-success
          fi            
      }

      poll-for-job-success




      
      
      
      


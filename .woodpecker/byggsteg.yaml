steps:
  byggsteg-trigger-jointhefreeworld:
    image: "alpine:3.22.0"
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]        
    environment:
      BYGGSTEG_URL: "https://byggsteg.jointhefreeworld.org" 
      BYGGSTEG_KEY:
        from_secret: "BYGGSTEG_KEY"
      BYGGSTEG_USERNAME: "Joe"
      JOB_CODE: |
        (lambda()
        `((project . "kracht")
          (branch-name . "trunk")
          (task . "make-test")
          (clone-url . "https://codeberg.org/jjba23/kracht")))
    commands: |
      apk add curl
      curl -s "$BYGGSTEG_URL/api/v1/jobs/manage/submit" \
        -X POST \
        -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode "username=$BYGGSTEG_USERNAME" \
        --data-urlencode "password=$BYGGSTEG_KEY" \
        --data-urlencode "job-code=$JOB_CODE" \
            > byggsteg-submit-job-response.json
      cat byggsteg-submit-job-response.json
      


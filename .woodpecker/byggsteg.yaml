steps:
  byggsteg-trigger-jointhefreeworld:
    image: "alpine:3.22.0"
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]        
    environment:
      POLL_INTERVAL_SECONDS: 6
      POLL_LIMIT: 1024
      POLL_COUNT: 0
      BYGGSTEG_JOB_SUCCEEDED: 0
      BYGGSTEG_JOB_FAILED: 0
      BYGGSTEG_JOB_IN_PROGRESS: 0
      BYGGSTEG_URL: "https://byggsteg.jointhefreeworld.org"
      BYGGSTEG_USERNAME:
        from_secret: "BYGGSTEG_USERNAME"
      BYGGSTEG_KEY:
        from_secret: "BYGGSTEG_KEY"
      JOB_CODE: |
        (lambda()
          \`((project . "kracht")
            (branch-name . "$CI_COMMIT_BRANCH")
            (task . "make-test")
            (clone-url . "https://codeberg.org/jjba23/kracht")))
    commands: |
      set -euo pipefail;

      get-timestamp() {
        date '+%Y-%m-%d %H:%M:%S%:z'
      }

      log-error() {
        echo -e "\n[ERROR][$(get-timestamp)] $1\n" >&2
      }

      log-info() {
        echo -e "\n[INFO][$(get-timestamp)] $1\n"
      }

      poll-for-job-success() {
          while [ "$POLL_COUNT" -lt "$POLL_LIMIT" ]; do        
              log-info "GET call to $BYGGSTEG_URL/api/v1/logs/$BYGGSTEG_LOG_ID"      
              curl -s "$BYGGSTEG_URL/api/v1/logs/$BYGGSTEG_LOG_ID" \
                  > byggsteg-log-response.json
              cat byggsteg-log-response.json | jq .

              POLL_COUNT=$(( POLL_COUNT + 1 ))

              BYGGSTEG_JOB_SUCCEEDED=$(cat byggsteg-log-response.json | jq -r '.["success"]')
              BYGGSTEG_JOB_FAILURE=$(cat byggsteg-log-response.json | jq -r '.["failure"]')
              BYGGSTEG_JOB_IN_PROGRESS=$(cat byggsteg-log-response.json | jq -r '.["in-progress"]')

              if [ "$BYGGSTEG_JOB_SUCCEEDED" == 1 ]; then
                  log-info "Byggsteg job completed successfully!"
                  exit 0
              fi

              if [ "$BYGGSTEG_JOB_FAILED" == 1 ]; then
                  log-error "Byggsteg job failed!"
                  exit 1
              fi      

              if [ "$BYGGSTEG_JOB_IN_PROGRESS" == 1 ]; then
                  log-info "Byggsteg job in progress... will poll again for status in $POLL_INTERVAL_SECONDS seconds"
                  sleep "$POLL_INTERVAL_SECONDS"
              fi
          done

          log-error "Reached limit of poll attempts ($POLL_LIMIT), pipeline failed"
          exit 1          
      }
      
      main() {
          log-info "Installing base packages on Alpine distribution"
          apk add --no-cache curl jq

          eval "BYGGSTEG_JOB_CODE=\"$JOB_CODE\""

          log-info "POST call to $BYGGSTEG_URL/api/v1/jobs/manage/submit"
          curl -s "$BYGGSTEG_URL/api/v1/jobs/manage/submit" \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=$BYGGSTEG_USERNAME" \
            --data-urlencode "password=$BYGGSTEG_KEY" \
            --data-urlencode "job-code=$BYGGSTEG_JOB_CODE" \
                > byggsteg-submit-job-response.json
          cat byggsteg-submit-job-response.json | jq .

          BYGGSTEG_LOG_ID=$(cat byggsteg-submit-job-response.json | jq -r '.["log-id"]')
          log-info "Job created at Byggsteg successfully, log-id: $BYGGSTEG_LOG_ID"

          # start polling for job status until success or limit reached
          poll-for-job-success
      }

      # Run the main function
      main



      
      
      
      

